name = "overlay-radar"
main = "worker/index.js"
compatibility_date = "2025-01-01"

[assets]
directory = "./site"
binding = "ASSETS"

# Create with:  npx wrangler kv namespace create STATE   -> paste the id below
[[kv_namespaces]]
binding = "STATE"
id = "e5d53f89ded44dc18b45e3e712939b89"

[triggers]
# Every 2 min, 00:00–13:59 UTC (covers Australian racing hours). Uses ~420 KV writes/day (free limit 1,000).
crons = ["*/2 0-13 * * *"]

[vars]
PE_INTERVAL_MIN = "35"
MAX_TAB_RACES = "15"
